server:
  port: 8081
spring:
  datasource:
    url: jdbc:h2:mem:smartcart_users;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
smartcart:
  seed-users: true
