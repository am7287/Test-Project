server:
  port: 8080
spring:
  cloud:
    gateway:
      routes:
        - id: users
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: products
          uri: http://localhost:8082
          predicates:
            - Path=/api/products/**
        - id: orders
          uri: http://localhost:8083
          predicates:
            - Path=/api/orders/**
